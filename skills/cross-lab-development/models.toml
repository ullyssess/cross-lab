# Cross-lab model roster — BUNDLED DEFAULTS.
# Do not edit this file: plugin updates overwrite it. Use `set-model`, which
# copies it to ~/.claude/cross-lab/models.toml on first write and edits that.
# Roles are FIXED — you only swap the models bound to them.
# Precedence: invocation arguments > your roster > this file.

[planner]
# The model of THIS Claude Code session. The skill VERIFIES it, never switches
# it — the plan exists before the skill starts. Mismatch => the skill asks for /model.
# Allowed: opus | sonnet | haiku | fable
model = "opus"

[implementer]
# codex exec -m <model>. Full OpenAI model string.
# Which models work depends on YOUR account (ChatGPT plan vs API key) —
# `set-model implementer <model>` probes before writing.
model = "gpt-5.5"

[plan_reviewer]
# codex exec -m <model> in xlab-plan-review.sh (plan review before Task 1).
# Empty = same as implementer. A Claude alias makes no sense here: Claude
# wrote the plan, so the reviewer must be the other lab.
model = ""

[reviewer]
# Agent(model:) — aliases ONLY: sonnet | opus | haiku | fable.
# A full ID (claude-opus-4-8) does NOT work. An OpenAI model here breaks
# "no codex self-review" => validation rejects it.
light   = "haiku"    # small, mechanical diff
default = "opus"     # typical task
heavy   = "opus"     # architecture / security / concurrency
final   = "opus"     # whole-branch review at the end
